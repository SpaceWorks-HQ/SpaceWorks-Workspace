name: Publish container images

# Multi-arch images on GitHub Container Registry, after CI passed for a push
# to main, or for a version tag (v1.2.3). Pull requests never publish.
#   ghcr.io/spaceworks-hq/spaceworks-workspace           (runner, generic)
#   ghcr.io/spaceworks-hq/spaceworks-workspace-migrator  (prisma migrate deploy)
# The runner image is generic: no hostname or secret is compiled in; every
# instance supplies its own configuration at runtime. See docs/CONTAINER_IMAGES.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: ghcr.io/spaceworks-hq/spaceworks-workspace
      MIGRATOR_IMAGE: ghcr.io/spaceworks-hq/spaceworks-workspace-migrator
      REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false

      - name: Image tags
        id: tags
        run: |
          short=${REVISION:0:12}
          app="$APP_IMAGE:sha-$short"
          migrator="$MIGRATOR_IMAGE:sha-$short"
          if [[ "$GITHUB_REF_TYPE" = tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            app="$app,$APP_IMAGE:${GITHUB_REF_NAME#v}"
            migrator="$migrator,$MIGRATOR_IMAGE:${GITHUB_REF_NAME#v}"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "migrator=$migrator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the migration image
        id: migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.migrator }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      - name: Build and push the application image
        id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=Space Works Workspace
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Record published images
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
          APP_TAGS: ${{ steps.tags.outputs.app }}
          MIGRATOR_TAGS: ${{ steps.tags.outputs.migrator }}
        run: |
          {
            printf 'Published commit `%s` for linux/amd64 and linux/arm64.\n\n' "$REVISION"
            printf 'Application: `%s`\n\nMigration: `%s`\n\n' "$APP_TAGS" "$MIGRATOR_TAGS"
            printf 'Pinned application: `%s@%s`\n\nPinned migration: `%s@%s`\n' "$APP_IMAGE" "$APP_DIGEST" "$MIGRATOR_IMAGE" "$MIGRATOR_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
