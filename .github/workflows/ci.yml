name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Prisma resolves datasource URLs while validating and generating, even
  # without connecting. Placeholders only.
  DATABASE_URL: postgresql://build:build@localhost:5432/sww_build
  DIRECT_URL: postgresql://build:build@localhost:5432/sww_build
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      # Route types (PageProps, RouteContext) are generated, not committed.
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sww
          POSTGRES_PASSWORD: sww_ci
          POSTGRES_DB: sww_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sww -d sww_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sww:sww_ci@localhost:5432/sww_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Applies committed migrations; also proves they run on an empty database.
      - run: npm run db:test:prepare
      - run: npm run test:integration

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reported, not blocking: advisories without a fix must not stop every merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
