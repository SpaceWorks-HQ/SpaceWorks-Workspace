# Published images only. Use scripts/spaceworks-workspace-compose.sh.
# Data services have no published ports; jobs and data networks are private.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}
x-app: &app
  image: ${SWW_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-backend}:${SWW_IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp, "/app/.next/cache:uid=1001,gid=1001"]
  env_file: ./config/app.env
  volumes: ["./config/tls/ca.crt:/tls/ca.crt:ro"]
  networks: [edge, jobs, data]
  logging: *logging
  stop_grace_period: 30s
x-ready: &ready
  migrate: {condition: service_completed_successfully}
  redis: {condition: service_healthy}
  silo-init: {condition: service_completed_successfully}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./config/postgres.env
    entrypoint: [/bin/sh, /bootstrap/postgres-start.sh]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/tls/postgres:/run/server-tls:ro
      - ./docker/services/postgres-start.sh:/bootstrap/postgres-start.sh:ro
      - ./docker/services/init-database.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
      - ./docker/services/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [CMD, pg_isready, -U, sww, -d, sww]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    logging: *logging
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: [/bin/sh, /bootstrap/redis-start.sh]
    volumes:
      - redis_data:/data
      - ./config/tls/redis:/run/server-tls:ro
      - ./config/tls/ca.crt:/tls/ca.crt:ro
      - ./config/redis.conf:/run/redis.conf:ro
      - ./docker/services/redis-start.sh:/bootstrap/redis-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, "redis-cli --tls --cacert /tls/ca.crt -h redis ping 2>&1 | grep -q NOAUTH"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    logging: *logging
  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    env_file: ./config/storage.env
    command: [server, /data, --certs-dir, /server-tls]
    volumes:
      - storage_data:/data
      - ./config/tls/silo:/server-tls:ro
      - ./config/tls/ca.crt:/tls/ca.crt:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /tls/ca.crt, "https://silo:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    logging: *logging
  silo-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    env_file: ./config/storage-init.env
    entrypoint: [/bin/sh, /bootstrap/init-storage.sh]
    volumes:
      - ./docker/services/init-storage.sh:/bootstrap/init-storage.sh:ro
      - ./config/tls/ca.crt:/tls/ca.crt:ro
    depends_on: {silo: {condition: service_healthy}}
    networks: [data]
    logging: *logging
  migrate:
    image: ${SWW_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-backend}:${SWW_IMAGE_TAG:-latest}
    command: [migrate]
    env_file: ./config/migrate.env
    volumes: ["./config/tls/ca.crt:/tls/ca.crt:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data, edge]
    logging: *logging
  backend:
    <<: *app
    command: [web]
    depends_on: *ready
  scheduler:
    image: ${SWW_BACKEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-backend}:${SWW_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: [scheduler]
    env_file: ./config/scheduler.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck: {disable: true}
    depends_on: {backend: {condition: service_healthy}}
    networks: [jobs]
    logging: *logging
  frontend:
    image: ${SWW_FRONTEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-frontend}:${SWW_IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:3000}
      SWW_TRUST_FORWARDED_PROTO: "1"
      SWW_TRUSTED_PROXY_CIDR: ${SWW_TRUSTED_PROXY_CIDR:-172.30.80.0/24}
    ports: ["${SWW_BIND:-127.0.0.1}:${SWW_EDGE_PORT:-8080}:8080"]
    depends_on: {backend: {condition: service_healthy}}
    networks: [edge]
    logging: *logging
  app:
    <<: *app
    image: ${SWW_ALLINONE_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-allinone}:${SWW_IMAGE_TAG:-latest}
    profiles: [single]
    environment:
      SWW_SCHEDULER_ENABLED: ${SWW_SCHEDULER_ENABLED:-1}
      SWW_TRUST_FORWARDED_PROTO: "1"
      SWW_TRUSTED_PROXY_CIDR: ${SWW_TRUSTED_PROXY_CIDR:-172.30.80.0/24}
    ports: ["${SWW_BIND:-127.0.0.1}:${SWW_EDGE_PORT:-8080}:8080"]
    depends_on: *ready
  ops:
    <<: *app
    profiles: [tools]
    restart: "no"
    read_only: false
    env_file: [./config/app.env, ./config/migrate.env]
    command: [ops, node, /app/scripts/check-production-env.mjs]
    healthcheck: {disable: true}
    networks: [data, edge]
  storage-backup:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    profiles: [tools]
    env_file: ./config/storage-init.env
    entrypoint: [/bin/sh, /bootstrap/storage-backup.sh]
    volumes:
      - ./docker/services/storage-backup.sh:/bootstrap/storage-backup.sh:ro
      - ./config/tls/ca.crt:/tls/ca.crt:ro
      - ./backups:/backups
    networks: [data]
networks:
  edge:
    ipam:
      config: [{subnet: "${SWW_EDGE_SUBNET:-172.30.80.0/24}"}]
  jobs: {internal: true}
  data: {internal: true}
volumes:
  postgres_data:
  redis_data:
  storage_data:
