# Split backend uses the published frontend image with this same routing template.
# Same routing in standalone frontend and all-in-one. CSP remains app-owned.
map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
map $http_x_forwarded_proto $external_scheme { default $scheme; https https; }
# Only explicitly configured proxy CIDRs may supply real client addresses.
server {
    listen 8080;
    server_name _;
    root /srv/www;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 30m;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;
    set_real_ip_from ${SWW_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # With no trusted proxy the entrypoint sets the scheme to the local scheme.
    set $public_scheme ${SWW_FORWARDED_SCHEME};
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { return 200 'ready\n'; add_header Content-Type text/plain; }
    location ^~ /_next/static/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ^~ /brand/ {
        add_header Cache-Control 'public, max-age=3600, must-revalidate';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = / { try_files /__workspace_no_static_index__ @backend; }
    location / {
        add_header Cache-Control 'public, max-age=0, must-revalidate';
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @backend;
    }
    location @backend {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host ${SWW_BACKEND_HOST_HEADER};
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP '';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
