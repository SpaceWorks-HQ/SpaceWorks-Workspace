services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sww:sww_dev_password@postgres:5432/sww_dev
      DIRECT_URL: postgresql://sww:sww_dev_password@postgres:5432/sww_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://silo:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["127.0.0.1:${SWW_DEV_APP_PORT:-3000}:3000"]
    volumes: [".:/app", dev_modules:/app/node_modules, dev_next:/app/.next]
    depends_on: {postgres: {condition: service_healthy}, silo-init: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
volumes:
  dev_modules:
  dev_next:
