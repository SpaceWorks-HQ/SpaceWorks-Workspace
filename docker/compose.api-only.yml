# Split backend: the same nginx runtime, with no extra build or public storage route.
services:
  frontend:
    profiles: [website-disabled]
  api-edge:
    image: ${SWW_FRONTEND_IMAGE:-ghcr.io/spaceworks-hq/spaceworks-workspace-frontend}:${SWW_IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BACKEND_UPSTREAM: http://backend:3000
      SWW_TRUST_FORWARDED_PROTO: "1"
      SWW_TRUSTED_PROXY_CIDR: ${SWW_TRUSTED_PROXY_CIDR:-172.30.80.0/24}
    ports: ["${SWW_BIND:-127.0.0.1}:${SWW_EDGE_PORT:-8080}:8080"]
    depends_on: {backend: {condition: service_healthy}}
    networks: [edge]
