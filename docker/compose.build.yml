# Full source checkout only; the curl installer never builds on the host.
services:
  backend:
    build: {context: ., dockerfile: Dockerfile}
  migrate:
    build: {context: ., dockerfile: Dockerfile}
  scheduler:
    build: {context: ., dockerfile: Dockerfile}
  ops:
    build: {context: ., dockerfile: Dockerfile}
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args: {SWW_BACKEND_BUILD: backend-build}
      additional_contexts: {backend-build: "service:backend"}
  app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args: {SWW_BACKEND_BUILD: backend-build}
      additional_contexts: {backend-build: "service:backend"}
