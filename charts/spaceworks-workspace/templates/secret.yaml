{{- if .Values.secret.create }}
{{- if not .Values.secret.data }}
{{- fail "secret.create=true needs secret.data (the runtime environment)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sww.secretName" . }}
  labels:
    {{- include "sww.labels" . | nindent 4 }}
  annotations:
    # Created before the migration hook, which reads it. As a hook resource it
    # is not deleted by `helm uninstall`; remove it yourself when retiring.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $name, $value := .Values.secret.data }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
