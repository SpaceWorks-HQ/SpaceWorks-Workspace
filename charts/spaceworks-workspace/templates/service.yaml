apiVersion: v1
kind: Service
metadata:
  name: {{ include "sww.fullname" . }}
  labels:
    {{- include "sww.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ ternary "frontend" "http" .Values.frontend.enabled }}
      protocol: TCP
  selector:
    {{- include "sww.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
